---

# Example vars for playbooks/openedx_multivm_4vm.yml.
# Replace every CHANGE_ME value before production use.

COMMON_ENVIRONMENT: production
COMMON_DEPLOYMENT: openedx
COMMON_ENABLE_AWS_ROLE: false
COMMON_ENABLE_DATADOG: false
COMMON_ENABLE_SPLUNKFORWARDER: false
COMMON_ENABLE_NEWRELIC: false
COMMON_ENABLE_NEWRELIC_APP: false
COMMON_ENABLE_NEWRELIC_INFRASTRUCTURE: false
COMMON_ENABLE_MINOS: false
COMMON_RETIREMENT_SERVICE_SETUP: false
COMMON_CONFIG_NO_LOGGING: false
UNENCRYPTED_CFG_DIR: "/edx/etc"
ENCRYPTED_CFG_DIR: "/edx/etc"

EDXAPP_LMS_BASE: "lms.example.com"
EDXAPP_CMS_BASE: "studio.example.com"
EDXAPP_SITE_NAME: "{{ EDXAPP_LMS_BASE }}"
EDXAPP_LMS_SITE_NAME: "{{ EDXAPP_LMS_BASE }}"
EDXAPP_CMS_SITE_NAME: "{{ EDXAPP_CMS_BASE }}"
EDXAPP_LMS_BASE_SCHEME: http
COMMON_LMS_BASE_URL: "{{ EDXAPP_LMS_BASE_SCHEME }}://{{ EDXAPP_LMS_BASE }}"

multivm_app_private_ip: "10.30.1.10"
multivm_worker_private_ip: "10.30.1.11"
multivm_mysql_private_ip: "10.30.2.10"
multivm_mongo_private_ip: "10.30.2.11"
multivm_app_mysql_user_host: "10.30.1.%"
multivm_mysql_bind_ip: "{{ multivm_mysql_private_ip }}"
multivm_mongo_bind_ip: "0.0.0.0"

EDXAPP_MYSQL_HOST: "{{ multivm_mysql_private_ip }}"
EDXAPP_MYSQL_PORT: "3306"
EDXAPP_MYSQL_DB_NAME: "edxapp"
EDXAPP_MYSQL_USER: "edxapp001"
EDXAPP_MYSQL_PASSWORD: "CHANGE_ME_EDXAPP_MYSQL_PASSWORD"
EDXAPP_MYSQL_CSMH_DB_NAME: "edxapp_csmh"
EDXAPP_MYSQL_CSMH_USER: "edxapp_cmsh001"
EDXAPP_MYSQL_CSMH_PASSWORD: "CHANGE_ME_EDXAPP_MYSQL_CSMH_PASSWORD"
EDXAPP_MYSQL_PASSWORD_READ_ONLY: "CHANGE_ME_EDXAPP_MYSQL_READ_ONLY_PASSWORD"
EDXAPP_MYSQL_PASSWORD_ADMIN: "CHANGE_ME_EDXAPP_MYSQL_ADMIN_PASSWORD"

COMMON_MYSQL_MIGRATE_USER: "migrate"
COMMON_MYSQL_MIGRATE_PASS: "CHANGE_ME_MYSQL_MIGRATE_PASSWORD"
COMMON_MYSQL_READ_ONLY_USER: "read_only"
COMMON_MYSQL_READ_ONLY_PASS: "{{ EDXAPP_MYSQL_PASSWORD_READ_ONLY }}"
COMMON_MYSQL_ADMIN_USER: "admin"
COMMON_MYSQL_ADMIN_PASS: "{{ EDXAPP_MYSQL_PASSWORD_ADMIN }}"

EDXAPP_MONGO_HOSTS:
  - "{{ multivm_mongo_private_ip }}"
EDXAPP_MONGO_PORT: 27017
EDXAPP_MONGO_DB_NAME: "edxapp"
EDXAPP_MONGO_USER: "edxapp"
EDXAPP_MONGO_PASSWORD: "CHANGE_ME_EDXAPP_MONGO_PASSWORD"
EDXAPP_MONGO_AUTH_DB: "{{ EDXAPP_MONGO_DB_NAME }}"
EDXAPP_MONGO_REPLICA_SET: "{{ MONGO_REPL_SET }}"

MONGO_BIND_IP: "{{ multivm_mongo_bind_ip }}"
MONGO_ADMIN_USER: "admin"
MONGO_ADMIN_PASSWORD: "CHANGE_ME_MONGO_ADMIN_PASSWORD"
MONGO_CLUSTER_KEY: "CHANGE_ME_LONG_RANDOM_MONGO_CLUSTER_KEY"
MONGO_REPL_SET: "rs0"
MONGO_RS_CONFIG:
  _id: "{{ MONGO_REPL_SET }}"
  members:
    - host: "{{ multivm_mongo_private_ip }}"
MONGO_USERS:
  - user: "{{ EDXAPP_MONGO_USER }}"
    password: "{{ EDXAPP_MONGO_PASSWORD }}"
    database: "{{ EDXAPP_MONGO_DB_NAME }}"
    roles: readWrite

REDIS_BIND_IP: "{{ multivm_worker_private_ip }}"
REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"

rabbitmq_ip: "{{ multivm_worker_private_ip }}"
RABBIT_ADMIN_PASSWORD: "CHANGE_ME_RABBIT_ADMIN_PASSWORD"
RABBIT_ERLANG_COOKIE: "CHANGE_ME_LONG_RANDOM_RABBIT_COOKIE"
RABBIT_USERS:
  - name: "admin"
    password: "{{ RABBIT_ADMIN_PASSWORD }}"
  - name: "edx"
    password: "CHANGE_ME_RABBIT_EDX_PASSWORD"
  - name: "celery"
    password: "CHANGE_ME_RABBIT_CELERY_PASSWORD"

EDXAPP_RABBIT_HOSTNAME: "{{ multivm_worker_private_ip }}"
EDXAPP_REDIS_HOSTNAME: "{{ multivm_worker_private_ip }}"
EDXAPP_CELERY_PASSWORD: "{{ REDIS_PASSWORD }}"

EDXAPP_EDXAPP_SECRET_KEY: "CHANGE_ME_DJANGO_SECRET_KEY"
EDXAPP_PROFILE_IMAGE_SECRET_KEY: "CHANGE_ME_PROFILE_IMAGE_SECRET_KEY"
COMMON_JWT_SECRET_KEY: "CHANGE_ME_COMMON_JWT_SECRET_KEY"
COMMON_JWT_AUDIENCE: "openedx"
FERNET_KEYS:
  - "CHANGE_ME_FERNET_KEY"
EDXAPP_RETIRED_USER_SALTS:
  - "CHANGE_ME_RETIRED_USER_SALT"

CONFIGURE_JWTS: false
EDXAPP_ENABLE_MEMCACHE: false
EDXAPP_ENABLE_ELASTIC_SEARCH: false
SANDBOX_ENABLE_REDIS: false
SANDBOX_ENABLE_ECOMMERCE: false
SANDBOX_ENABLE_DISCOVERY: false
SANDBOX_ENABLE_ANALYTICS_API: false
SANDBOX_ENABLE_INSIGHTS: false
SANDBOX_ENABLE_NOTES: false
SANDBOX_ENABLE_BLOCKSTORE: false
DEMO_ROLE_ENABLED: false
